# ---------------------------------------------------------------------------
# Brottsplatskartan (local) — dashboard and automation examples
#
# Entity ids below assume `municipalities: [Stockholm]`, which names the
# entities:
#   sensor.brottsplatskartan_stockholm_incidents
#   sensor.brottsplatskartan_stockholm_latest_incident
#   event.brottsplatskartan_stockholm_new_incident
# With a different municipality list (or none), the slug changes — check
# Developer Tools -> States and adjust.
# ---------------------------------------------------------------------------


# ===========================================================================
# 1. MAP — one marker per incident
# ===========================================================================
# This is the whole point of the geo_location platform. Markers appear and
# disappear as incidents enter and leave the rolling window. Clicking one
# opens the more-info dialog with the headline, description and links.
#
# `geo_location_sources` is required — without it the card shows nothing,
# which is the single most common reason people think the platform is broken.

- type: map
  geo_location_sources:
    - brottsplatskartan_local
  auto_fit: true
  theme_mode: auto
  # Drop `hours_to_show` if you want markers to disappear the moment they
  # leave the window rather than lingering on the map's own history.
  hours_to_show: 24


# ===========================================================================
# 2. INCIDENT FEED — headline, description and both links
# ===========================================================================
# Reads the `incidents` attribute, which carries the full list (newest first).

- type: markdown
  title: Händelser senaste dygnet
  content: |-
    {% set rows = state_attr('sensor.brottsplatskartan_stockholm_incidents', 'incidents') or [] %}
    {% if rows %}
    {% for i in rows %}
    **{{ i.type }}** · {{ i.date_human }} · {{ i.place or i.municipality }}

    [{{ i.title }}]({{ i.url }})

    {{ i.description }}
    {%- if i.source_url %} · [Polisens rapport]({{ i.source_url }}){% endif %}
    {% if not loop.last %}
    ---
    {% endif %}
    {%- endfor %}
    {% if state_attr('sensor.brottsplatskartan_stockholm_incidents', 'truncated') %}
    *Listan är kapad — höj `max_attribute_incidents` för fler.*
    {% endif %}
    {% else %}
    Inga händelser senaste dygnet.
    {% endif %}


# ===========================================================================
# 3. COUNT + BREAKDOWN BY CRIME TYPE
# ===========================================================================
# `by_type` is a dict of {crime type: count}, already sorted most-common first.

- type: markdown
  title: Sammanfattning
  content: |-
    {% set s = 'sensor.brottsplatskartan_stockholm_incidents' %}
    ## {{ states(s) }} händelser senaste {{ state_attr(s, 'window_hours') }} h
    {{ state_attr(s, 'municipalities') | join(', ') or state_attr(s, 'area') }}

    {% for type, n in (state_attr(s, 'by_type') or {}).items() -%}
    - **{{ type }}** — {{ n }}
    {% endfor %}
    <sub>{{ state_attr(s, 'fetched_in_county') }} händelser i hela {{ state_attr(s, 'area') }} under samma period.</sub>


# ===========================================================================
# 4. LATEST INCIDENT, WITH THE API'S OWN STATIC MAP IMAGE
# ===========================================================================
# The API ships a rendered map thumbnail per incident (`image_wide`), which is
# only exposed on the latest-incident sensor — the URLs are long, so putting
# one on every row of the feed would blow past the recorder's attribute limit.

- type: markdown
  title: Senaste händelsen
  content: |-
    {% set s = 'sensor.brottsplatskartan_stockholm_latest_incident' %}
    {% if states(s) not in ['unknown', 'unavailable'] %}
    ### {{ state_attr(s, 'type') }} — {{ state_attr(s, 'place') }}

    ![Karta]({{ state_attr(s, 'image_wide') }})

    **{{ states(s) }}**

    {{ state_attr(s, 'description') }}

    {{ state_attr(s, 'location') }} · {{ state_attr(s, 'date_human') }}

    [Brottsplatskartan]({{ state_attr(s, 'url') }}){% if state_attr(s, 'source_url') %} · [Polisen]({{ state_attr(s, 'source_url') }}){% endif %}
    {% else %}
    Ingen händelse i fönstret.
    {% endif %}


# ===========================================================================
# 5. TREND — is this week worse than usual?
# ===========================================================================
# The count sensor has state_class: measurement, so long-term statistics are
# recorded and this card works without any extra configuration.

- type: statistics-graph
  title: Brottstrend
  entities:
    - sensor.brottsplatskartan_stockholm_incidents
  stat_types:
    - mean
    - max
  period: hour
  days_to_show: 30

# A plain history graph is the quick version.
- type: history-graph
  entities:
    - sensor.brottsplatskartan_stockholm_incidents
  hours_to_show: 168


# ===========================================================================
# 6. BADGES — compact header row
# ===========================================================================
- type: entities
  title: Brottsplatskartan
  entities:
    - entity: sensor.brottsplatskartan_stockholm_incidents
      name: Senaste dygnet
    - entity: sensor.brottsplatskartan_nearest_incident
      name: Närmaste händelse
    - entity: sensor.brottsplatskartan_stockholm_latest_incident
      name: Senaste


# ===========================================================================
# 7. "SOMETHING HAPPENED NEARBY" — only shows when it is true
# ===========================================================================
- type: conditional
  conditions:
    - condition: numeric_state
      entity: sensor.brottsplatskartan_nearest_incident
      below: 2
  card:
    type: markdown
    content: |-
      ### ⚠️ Händelse {{ states('sensor.brottsplatskartan_nearest_incident') }} km bort
      {{ state_attr('sensor.brottsplatskartan_nearest_incident', 'headline') }}


