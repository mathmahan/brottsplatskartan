# ---------------------------------------------------------------------------
# Brottsplatskartan (local) — dashboard.
#
# Paste the whole file into:
#   Settings -> Dashboards -> (your dashboard) -> pencil -> ⋮
#   -> Raw configuration editor      [replace what is there]
# For a single card: Add card -> Manual, then paste one entry from `cards:`.
#
# NO ENTITY IDS TO EDIT. Each card finds its sensor through
# integration_entities('brottsplatskartan_local'), so it works whatever your
# entry is called and keeps working if you rename it.
#
# ALL VISIBLE TEXT IS IN ONE PLACE PER CARD. Every markdown card opens with a
# "TEXT" block of {% set %} lines — change the strings there and nothing else.
# Card headings are the plain `title:` keys.
#
# Prefer clicking to editing YAML? Use dashboard-simple.yaml instead: same
# data, native cards only, no templates, fully editable in the visual editor.
#
# The last two cards need the template sensor from
# examples/configuration.yaml. Without it they show as unavailable — delete
# them if you skip that part.
# ---------------------------------------------------------------------------

views:
  - title: Brottsplatskartan
    path: brottsplatskartan
    icon: mdi:police-badge
    cards:

      # =====================================================================
      # MAP — one marker per incident
      # =====================================================================
      # Markers appear and disappear as incidents enter and leave the rolling
      # window. Click one for the headline, description and both links.
      #
      # Do NOT add `hours_to_show`. It makes the card draw each entity's
      # recorded history as well as its current position, and an incident
      # never moves — so every marker gets a second pin at the same spot and
      # the map appears to show everything twice.
      - type: map
        geo_location_sources:
          - brottsplatskartan_local
        auto_fit: true
        theme_mode: auto

      # =====================================================================
      # SUMMARY — count and per-crime-type breakdown
      # =====================================================================
      - type: markdown
        title: Sammanfattning
        content: |-
          {#- ===== TEXT — change these and nothing else ===== -#}
          {% set t_incidents = "händelser senaste" %}
          {% set t_hours = "h" %}
          {% set t_in_county = "händelser i hela" %}
          {% set t_same_period = "under samma period" %}
          {% set t_none = "Inga händelser i fönstret." %}
          {#- ===== end of text ===== -#}
          {% set found = integration_entities('brottsplatskartan_local')
               | select('search', '^sensor\..*_incidents$') | list %}
          {% set s = found[0] if found else '' %}
          {% if s %}
          ## {{ states(s) }} {{ t_incidents }} {{ state_attr(s, 'window_hours') }} {{ t_hours }}
          {{ state_attr(s, 'municipalities') | join(', ') or state_attr(s, 'area') }}

          {% for type, n in (state_attr(s, 'by_type') or {}).items() -%}
          - **{{ type }}** — {{ n }}
          {% endfor %}
          <sub>{{ state_attr(s, 'fetched_in_county') }} {{ t_in_county }} {{ state_attr(s, 'area') }} {{ t_same_period }}.</sub>
          {% else %}
          {{ t_none }}
          {% endif %}

      # =====================================================================
      # LATEST INCIDENT, with the API's own static map image
      # =====================================================================
      # The API ships a rendered map thumbnail per incident (`image_wide`),
      # exposed only on this sensor — the URLs run to several hundred
      # characters, so one per row of the feed would overflow the recorder's
      # attribute limit.
      - type: markdown
        title: Senaste händelsen
        content: |-
          {#- ===== TEXT — change these and nothing else ===== -#}
          {% set t_map_alt = "Karta" %}
          {% set t_read_more = "Brottsplatskartan" %}
          {% set t_police = "Polisen" %}
          {% set t_none = "Ingen händelse i fönstret." %}
          {#- ===== end of text ===== -#}
          {% set found = integration_entities('brottsplatskartan_local')
               | select('search', '^sensor\..*_latest_incident$') | list %}
          {% set s = found[0] if found else '' %}
          {% if s and states(s) not in ['unknown', 'unavailable'] %}
          ### {{ state_attr(s, 'type') }} — {{ state_attr(s, 'place') }}

          ![{{ t_map_alt }}]({{ state_attr(s, 'image_wide') }})

          **{{ states(s) }}**

          {{ state_attr(s, 'description') }}

          {{ state_attr(s, 'location') }} · {{ state_attr(s, 'date_human') }}

          [{{ t_read_more }}]({{ state_attr(s, 'url') }}){% if state_attr(s, 'source_url') %} · [{{ t_police }}]({{ state_attr(s, 'source_url') }}){% endif %}
          {% else %}
          {{ t_none }}
          {% endif %}

      # =====================================================================
      # FEED — headline, description and both links per incident
      # =====================================================================
      - type: markdown
        title: Händelser senaste dygnet
        content: |-
          {#- ===== TEXT — change these and nothing else ===== -#}
          {% set t_police_report = "Polisens rapport" %}
          {% set t_truncated = "Listan är kapad — höj \"Incidents listed in attributes\" i integrationens inställningar." %}
          {% set t_none = "Inga händelser senaste dygnet." %}
          {#- ===== end of text ===== -#}
          {% set found = integration_entities('brottsplatskartan_local')
               | select('search', '^sensor\..*_incidents$') | list %}
          {% set s = found[0] if found else '' %}
          {% set rows = state_attr(s, 'incidents') or [] if s else [] %}
          {% if rows %}
          {% for i in rows %}
          **{{ i.type }}** · {{ i.date_human }} · {{ i.place or i.municipality }}

          [{{ i.title }}]({{ i.url }})

          {{ i.description }}
          {%- if i.source_url %} · [{{ t_police_report }}]({{ i.source_url }}){% endif %}
          {% if not loop.last %}
          ---
          {% endif %}
          {%- endfor %}
          {% if state_attr(s, 'truncated') %}
          *{{ t_truncated }}*
          {% endif %}
          {% else %}
          {{ t_none }}
          {% endif %}

      # =====================================================================
      # TREND — is this week worse than usual?
      # =====================================================================
      # The count sensor sets state_class: measurement, so long-term
      # statistics are recorded and this needs no extra configuration.
      #
      # These two take literal entity ids, because graph cards cannot take a
      # template. If your entry is not named "Brottsplatskartan Stockholm",
      # change the ids here (Developer Tools -> States to find them).
      - type: statistics-graph
        title: Brottstrend
        entities:
          - sensor.brottsplatskartan_stockholm_incidents
        stat_types:
          - mean
          - max
        period: hour
        days_to_show: 30

      - type: history-graph
        title: Senaste veckan
        entities:
          - sensor.brottsplatskartan_stockholm_incidents
        hours_to_show: 168

      # =====================================================================
      # These two need the template sensor from examples/configuration.yaml
      # =====================================================================
      - type: entities
        title: Översikt
        entities:
          - entity: sensor.brottsplatskartan_stockholm_incidents
            name: Senaste dygnet
          - entity: sensor.brottsplatskartan_nearest_incident
            name: Närmaste händelse
          - entity: sensor.brottsplatskartan_stockholm_latest_incident
            name: Senaste

      # Only appears when something happened within 2 km.
      - type: conditional
        conditions:
          - condition: numeric_state
            entity: sensor.brottsplatskartan_nearest_incident
            below: 2
        card:
          type: markdown
          content: |-
            {#- ===== TEXT — change these and nothing else ===== -#}
            {% set t_nearby = "Händelse" %}
            {% set t_away = "km bort" %}
            {#- ===== end of text ===== -#}
            {% set s = 'sensor.brottsplatskartan_nearest_incident' %}
            ### ⚠️ {{ t_nearby }} {{ states(s) }} {{ t_away }}
            {{ state_attr(s, 'headline') }}
