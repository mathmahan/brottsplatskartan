# ---------------------------------------------------------------------------
# Brottsplatskartan (local) — a complete dashboard.
#
# This is a whole dashboard document, so it can be pasted straight into
#   Settings -> Dashboards -> (your dashboard) -> pencil -> ⋮ -> Raw
#   configuration editor
# replacing what is there. To take just one card instead, use
#   Add card -> Manual
# and paste a single entry from under `cards:` (without its leading `- `
# indentation offset — the editor expects the card object on its own).
#
# Entity ids assume the entry is named "Brottsplatskartan Stockholm", which is
# what picking `Stockholm` at setup gives you. A different municipality list
# changes the slug — check Developer Tools -> States and adjust.
#
# The last two cards need the template sensor from examples/configuration.yaml.
# Without it they show as unavailable; delete them if you skip that part.
# ---------------------------------------------------------------------------

views:
  - title: Brottsplatskartan
    path: brottsplatskartan
    icon: mdi:police-badge
    cards:

      # =====================================================================
      # MAP — one marker per incident
      # =====================================================================
      # The point of the geo_location platform. Markers appear and disappear
      # as incidents enter and leave the rolling window; clicking one opens
      # the more-info dialog with the headline, description and both links.
      #
      # `geo_location_sources` is required. Without it the card renders empty,
      # which is the usual reason people think the platform is broken.
      #
      # Do NOT add `hours_to_show` here. It makes the card draw each entity's
      # recorded history as well as its current position, and an incident
      # never moves — so every marker gets a second pin at the same spot and
      # the map appears to show everything twice. The integration's own
      # rolling window already decides which markers exist.
      - type: map
        geo_location_sources:
          - brottsplatskartan_local
        auto_fit: true
        theme_mode: auto

      # =====================================================================
      # SUMMARY — count and per-crime-type breakdown
      # =====================================================================
      - type: markdown
        title: Sammanfattning
        content: |-
          {% set s = 'sensor.brottsplatskartan_stockholm_incidents' %}
          ## {{ states(s) }} händelser senaste {{ state_attr(s, 'window_hours') }} h
          {{ state_attr(s, 'municipalities') | join(', ') or state_attr(s, 'area') }}

          {% for type, n in (state_attr(s, 'by_type') or {}).items() -%}
          - **{{ type }}** — {{ n }}
          {% endfor %}
          <sub>{{ state_attr(s, 'fetched_in_county') }} händelser i hela {{ state_attr(s, 'area') }} under samma period.</sub>

      # =====================================================================
      # LATEST INCIDENT, with the API's own static map image
      # =====================================================================
      # The API ships a rendered map thumbnail per incident (`image_wide`),
      # exposed only on this sensor — the URLs run to several hundred
      # characters, so one per row of the feed would overflow the recorder's
      # attribute limit.
      - type: markdown
        title: Senaste händelsen
        content: |-
          {% set s = 'sensor.brottsplatskartan_stockholm_latest_incident' %}
          {% if states(s) not in ['unknown', 'unavailable'] %}
          ### {{ state_attr(s, 'type') }} — {{ state_attr(s, 'place') }}

          ![Karta]({{ state_attr(s, 'image_wide') }})

          **{{ states(s) }}**

          {{ state_attr(s, 'description') }}

          {{ state_attr(s, 'location') }} · {{ state_attr(s, 'date_human') }}

          [Brottsplatskartan]({{ state_attr(s, 'url') }}){% if state_attr(s, 'source_url') %} · [Polisen]({{ state_attr(s, 'source_url') }}){% endif %}
          {% else %}
          Ingen händelse i fönstret.
          {% endif %}

      # =====================================================================
      # FEED — headline, description and both links per incident
      # =====================================================================
      - type: markdown
        title: Händelser senaste dygnet
        content: |-
          {% set rows = state_attr('sensor.brottsplatskartan_stockholm_incidents', 'incidents') or [] %}
          {% if rows %}
          {% for i in rows %}
          **{{ i.type }}** · {{ i.date_human }} · {{ i.place or i.municipality }}

          [{{ i.title }}]({{ i.url }})

          {{ i.description }}
          {%- if i.source_url %} · [Polisens rapport]({{ i.source_url }}){% endif %}
          {% if not loop.last %}
          ---
          {% endif %}
          {%- endfor %}
          {% if state_attr('sensor.brottsplatskartan_stockholm_incidents', 'truncated') %}
          *Listan är kapad — höj "Incidents listed in attributes" i integrationens inställningar.*
          {% endif %}
          {% else %}
          Inga händelser senaste dygnet.
          {% endif %}

      # =====================================================================
      # TREND — is this week worse than usual?
      # =====================================================================
      # The count sensor sets state_class: measurement, so long-term
      # statistics are recorded and this needs no extra configuration.
      - type: statistics-graph
        title: Brottstrend
        entities:
          - sensor.brottsplatskartan_stockholm_incidents
        stat_types:
          - mean
          - max
        period: hour
        days_to_show: 30

      - type: history-graph
        title: Senaste veckan
        entities:
          - sensor.brottsplatskartan_stockholm_incidents
        hours_to_show: 168

      # =====================================================================
      # These two need the template sensor from examples/configuration.yaml
      # =====================================================================
      - type: entities
        title: Översikt
        entities:
          - entity: sensor.brottsplatskartan_stockholm_incidents
            name: Senaste dygnet
          - entity: sensor.brottsplatskartan_nearest_incident
            name: Närmaste händelse
          - entity: sensor.brottsplatskartan_stockholm_latest_incident
            name: Senaste

      # Only appears when something happened within 2 km.
      - type: conditional
        conditions:
          - condition: numeric_state
            entity: sensor.brottsplatskartan_nearest_incident
            below: 2
        card:
          type: markdown
          content: |-
            ### ⚠️ Händelse {{ states('sensor.brottsplatskartan_nearest_incident') }} km bort
            {{ state_attr('sensor.brottsplatskartan_nearest_incident', 'headline') }}
