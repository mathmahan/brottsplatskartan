refresh:
  target:
    entity:
      integration: brottsplatskartan_local
      domain: sensor
get_incidents:
  target:
    entity:
      integration: brottsplatskartan_local
      domain: sensor
  fields:
    limit:
      required: false
      example: 10
      selector:
        number:
          min: 1
          max: 500
          mode: box
    incident_type:
      required: false
      example: Stöld
      selector:
        text:
          multiple: true
    within_km:
      required: false
      example: 2
      selector:
        number:
          min: 0.1
          max: 1000
          step: 0.1
          unit_of_measurement: km
          mode: box
