# ---------------------------------------------------------------------------
# Brottsplatskartan (local) — optional additions for configuration.yaml.
#
# NOTHING HERE IS REQUIRED. The integration is configured entirely in the UI
# under Settings -> Devices & services, and the nearest-incident distance and
# the proximity flag are entities it provides, so the template sensors this
# file used to carry are gone.
#
# What is left is a convenience and a bit of housekeeping. Append to
# configuration.yaml and restart. If you already have a `template:` or
# `recorder:` key, merge the items into the key you have rather than adding a
# second one — duplicate keys at the same level make Home Assistant reject the
# whole configuration.
#
# These are NOT dashboard cards (../dashboard.yaml) and NOT automations
# (./automations.yaml).
# ---------------------------------------------------------------------------

# Optional: one crime type on its own, for a gauge or a threshold automation.
# Change "Stöld" to whichever type you care about — the count sensor's
# `by_type` attribute lists what is available.
template:
  - sensor:
      - name: "Brottsplatskartan thefts"
        unique_id: bpk_thefts
        state_class: measurement
        state: >-
          {{ (state_attr('sensor.brottsplatskartan_stockholm_incidents', 'by_type')
              or {}).get('Stöld', 0) }}

# Housekeeping: keep the recorder database small.
recorder:
  exclude:
    entity_globs:
      # Transient, one per incident, and their state is only a distance.
      - geo_location.*
    entities:
      # Carries a long description and image URLs in its attributes.
      - sensor.brottsplatskartan_stockholm_latest_incident
