# ---------------------------------------------------------------------------
# Brottsplatskartan (local) — automations.
#
# These are list items for your existing automations.yaml (the file that
# `automation: !include automations.yaml` points at). Append them, keeping the
# `- ` at this indentation. Do NOT wrap them in an `automation:` key, and do
# not paste them into configuration.yaml.
#
# To add one through the UI instead, use the matching file in ./ui-editor/ —
# the UI's YAML editor takes a single automation object, and pasting a list
# into it fails with "not a valid option at '['0']'".
#
# Note: Home Assistant rewrites automations.yaml whenever you save an
# automation in the UI. The automations survive, but these comments will not.
#
# Replace notify.mobile_app_your_phone with your own notify service.
# ---------------------------------------------------------------------------

# Rich notification per new incident, with the API's map image attached.
# Uses the bus event rather than the event entity, because several incidents
# can arrive in one poll and the entity only holds the most recent.
- id: brottsplatskartan_new_incident
  alias: "Brottsplatskartan: new incident"
  mode: queued
  max: 10
  triggers:
    - trigger: event
      event_type: brottsplatskartan_local_new_incident
  actions:
    - action: notify.mobile_app_your_phone
      data:
        title: "{{ trigger.event.data.type }} — {{ trigger.event.data.place }}"
        message: "{{ trigger.event.data.description or trigger.event.data.title }}"
        data:
          image: "{{ trigger.event.data.image_wide }}"
          url: "{{ trigger.event.data.url }}"

# Something happened close to home. The radius lives in the integration's
# options, so there is no distance maths here and no template sensor to set
# up — just trigger on the binary sensor turning on.
- id: brottsplatskartan_incident_nearby
  alias: "Brottsplatskartan: incident nearby"
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.brottsplatskartan_stockholm_incident_nearby
      from: "off"
      to: "on"
  actions:
    - action: notify.mobile_app_your_phone
      data:
        title: >-
          {{ state_attr(trigger.entity_id, 'type') }}
          {{ state_attr(trigger.entity_id, 'distance_km') }} km bort
        message: "{{ state_attr(trigger.entity_id, 'title') }}"
        data:
          image: "{{ state_attr(trigger.entity_id, 'image_wide') }}"
          url: "{{ state_attr(trigger.entity_id, 'url') }}"
