# Paste the whole of this file into:
#   Settings -> Automations & scenes -> Create automation
#   -> ⋮ (top right) -> Edit in YAML   [replace what is there]
#
# This is a single automation OBJECT, with no leading "- " and no "id:".
# Handing the editor a list makes Home Assistant answer "Message malformed:
# not a valid option at '['0']'".
#
# The proximity radius is set in the integration's options
# (Settings -> Devices & services -> Brottsplatskartan -> Configure), not
# here, so there is no distance maths and no template sensor to create.
#
# Check the entity id matches yours, and replace
# notify.mobile_app_your_phone with your own notify service.

alias: "Brottsplatskartan: incident nearby"
description: >-
  Fires when an incident appears inside the radius configured on the
  integration.
mode: single
triggers:
  - trigger: state
    entity_id: binary_sensor.brottsplatskartan_stockholm_incident_nearby
    from: "off"
    to: "on"
conditions: []
actions:
  - action: notify.mobile_app_your_phone
    data:
      title: >-
        {{ state_attr(trigger.entity_id, 'type') }}
        {{ state_attr(trigger.entity_id, 'distance_km') }} km bort
      message: "{{ state_attr(trigger.entity_id, 'title') }}"
      data:
        image: "{{ state_attr(trigger.entity_id, 'image_wide') }}"
        url: "{{ state_attr(trigger.entity_id, 'url') }}"
